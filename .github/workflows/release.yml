name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit or ref to build
        default: main
        type: string
      channel:
        description: Build only, or publish a nightly (never a stable manual release)
        default: build
        type: choice
        options: [build, nightly]

concurrency:
  group: release-${{ inputs.channel || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

# The only workflow that uploads kohakutui, so PyPI needs one trusted publisher: this file
# (release.yml), environment `pypi`. Nightly runs come here too, dispatched by nightly.yml.
jobs:
  meta:
    name: Resolve the version
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      cargo_version: ${{ steps.version.outputs.cargo_version }}
      python_version: ${{ steps.version.outputs.python_version }}
      tag: ${{ steps.version.outputs.tag }}
      nightly: ${{ steps.version.outputs.nightly }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve the source; a nightly needs green CI on it
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = nightly ]; then
            result=$(gh run list --workflow ci.yml --commit "$sha" --event push --limit 1 --json conclusion --jq '.[0].conclusion // "missing"')
            test "$result" = success || { echo "::error::CI for $sha is $result"; exit 1; }
          fi
      - name: One version for every platform
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          args=()
          if [ "$CHANNEL" = nightly ]; then args+=(--nightly); fi
          python scripts/release_version.py "${args[@]}" --github-output "$GITHUB_OUTPUT"
      # A tag that disagrees with Cargo.toml is a mis-cut release: stop before anything is built
      - name: The tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          EXPECTED: ${{ steps.version.outputs.tag }}
        run: |
          test "$TAG" = "$EXPECTED" || { echo "::error::tag $TAG != Cargo.toml $EXPECTED"; exit 1; }

  # abi3: one wheel per platform serves every CPython from 3.10 on
  build-wheels:
    name: Wheel for ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: '2_28', native: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: '2_28', native: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, manylinux: '', native: true }
          - { os: macos-latest, target: aarch64-apple-darwin, manylinux: '', native: true }
          # Intel macs: cross-built on the arm runner (GitHub retired its Intel macOS images)
          - { os: macos-latest, target: x86_64-apple-darwin, manylinux: '', native: false }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Stamp the version
        env:
          ARTIFACT_VERSION: ${{ needs.meta.outputs.cargo_version }}
        run: python scripts/release_version.py --stamp "$ARTIFACT_VERSION"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - name: Smoke-test the wheel in a clean venv
        if: matrix.native
        env:
          EXPECTED_VERSION: ${{ needs.meta.outputs.python_version }}
        run: |
          python -m venv .venv-wheel
          if [ "${RUNNER_OS}" = "Windows" ]; then . .venv-wheel/Scripts/activate; else . .venv-wheel/bin/activate; fi
          pip install dist/*.whl
          # away from src/, so the import is the installed wheel
          cd dist
          python -c "import importlib.metadata as m, os; assert m.version('kohakutui') == os.environ['EXPECTED_VERSION']"
          python -c "import kohakutui; print(kohakutui.version(), kohakutui.PROTOCOL)"
          # a whole demo turn on the emulated terminal: the engine, not just the import
          python -c "
          from kohakutui import App
          from kohakutui.demo.agent import agent
          app = App(backend='test', size=(90, 30), interrupt='event')
          agent(speed=0.0, interactive=False, app=app)
          assert any(l.startswith('● Done.') for l in app.history()), app.history()
          print('demo ok')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  build-sdist:
    name: Build the sdist
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Stamp the version
        env:
          ARTIFACT_VERSION: ${{ needs.meta.outputs.cargo_version }}
        run: python scripts/release_version.py --stamp "$ARTIFACT_VERSION"
      - name: Build
        run: |
          pip install maturin twine
          maturin sdist --out dist
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-to-pypi:
    name: Publish to PyPI
    needs: [meta, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: needs.meta.outputs.nightly == 'true' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    environment:
      name: pypi
      url: https://pypi.org/p/kohakutui
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -lh dist/

      - name: Nightly notes and checksums
        if: needs.meta.outputs.nightly == 'true'
        env:
          SOURCE_SHA: ${{ needs.meta.outputs.sha }}
          ARTIFACT_VERSION: ${{ needs.meta.outputs.python_version }}
        run: |
          printf 'Automatic nightly build (not a stable release).\n\nVersion: %s\n\nSource commit: %s\n' "$ARTIFACT_VERSION" "$SOURCE_SHA" > nightly-notes.md
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Nightly as a dated prerelease
        if: needs.meta.outputs.nightly == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ needs.meta.outputs.sha }}
          name: Nightly ${{ needs.meta.outputs.python_version }}
          prerelease: true
          make_latest: false
          body_path: nightly-notes.md
          files: dist/*
      - name: Keep the checksum file off PyPI
        if: needs.meta.outputs.nightly == 'true'
        run: rm dist/SHA256SUMS.txt

      - name: Upload to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
