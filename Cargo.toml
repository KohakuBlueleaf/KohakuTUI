[package]
name = "kohakutui"
version = "0.0.1"
edition = "2021"
description = "Terminal UI engine (kohakutui._rs) driven by a Python SDK"
license = "Apache-2.0"
# tests/ holds the Python suite; Rust tests live in each module's tests.rs
autotests = false

[lib]
name = "kohakutui_rs"
path = "src/kohakutui-rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"], optional = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["bracketed-paste", "use-dev-tty"] }
crossbeam-channel = "0.5"
rmpv = "1.3"


pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
unicode-segmentation = "1"
thiserror = "2"
# terminal emulator behind the "test" backend: tests read what the bytes would show
vt100 = "0.18"

[target.'cfg(unix)'.dependencies]
# kill(0, SIGINT) for the "signal" interrupt policy
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# WriteConsoleW to CONOUT$, so text reaches the console as UTF-16 whatever the code page
crossterm_winapi = "0.9"

[dev-dependencies]
proptest = "1"

[profile.release]
lto = "fat"
codegen-units = 1
